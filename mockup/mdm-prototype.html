const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const go = h => { location.hash = h; };
const toast = m => { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); };
const I = (n, extra='') => `<i class="bi ${n} ${extra}"></i>`;
const tagColor = s => ({ submitted:'yellow', 'in review':'yellow', draft:'blue', approved:'green', rejected:'red', stale:'red', partial:'yellow', suspended:'yellow', success:'green', done:'green', superseded:'', running:'blue', failed:'red', ok:'green', skipped:'yellow', conflict:'red', uncertain:'purple', current:'green', active:'blue', archived:'', prod:'red', dev:'blue', warn:'yellow', owned:'yellow', stretch:'purple', blocked:'red', compatible:'green', external:'' }[s] || '');
const T = (s, label) => `<span class="tag ${tagColor(s)}">${esc(label ?? s)}</span>`;
const yearSet = y => yearSets.find(x => x.year === +y);
const approvedManifests = y => manifests.filter(m => m.year === y && m.status === 'approved');
const ensureDraft = () => { let d = changeRequests.find(c => c.status === 'draft' && c.year === 2026 && c.contributors.includes(me().id)); if (!d) { d = { id: Math.max(...changeRequests.map(c=>c.id))+1, title: 'Untitled changes', year: 2026, author: me().id, contributors: [me().id], status: 'draft', created: '2026-10-06', hash: null, items: [] }; changeRequests.unshift(d); } return d; };

window.crSubmit = id => { const c = changeRequests.find(x => x.id === id); c.status = 'submitted'; c.hash = Math.random().toString(16).slice(2,6) + '…' + Math.random().toString(16).slice(2,4); toast(`#${id} submitted — batch frozen (${c.hash})`); render(); };

window.crApprove = id => {
  const c = changeRequests.find(x => x.id === id);
  const stale = c.items.filter(it => it.recordId && descriptors.find(d => d.id === it.recordId).rev !== it.base);
  if (stale.length || c.stale) { c.stale = true; toast(`Rejected as stale: ${stale.length || 1} item(s) have a newer base revision. Reopen, rebase, resubmit.`); render(); return; }
  const ys = yearSet(c.year);
  c.items.forEach(it => { if (it.recordId) { const d = descriptors.find(x => x.id === it.recordId); d.rev += 1; if (it.op === 'update' && it.after.description) d.desc = it.after.description; } });
  ys.revision += c.items.length || 1; c.status = 'approved'; c.approver = me().id;

        <tr class="diff-ext"><td>${T('','visibility')}</td><td class="mono">schools · School#255901104 · webSite</td><td>https://wlms.lakeside.org</td><td class="muted">not managed</td><td>External (SIS) — preserved in PUT</td><td class="mono">"e01b…"</td></tr>

    <div class="row between" style="margin-top:1.5rem"><button class="btn" onclick="S.push.step=1;render()">${I('bi-arrow-left')} Targets</button><button class="btn primary" onclick="approveManifest()">${I('bi-lock')} Approve manifest</button></div></div>` });

window.approveManifest = () => {

  ];
  if (p.deletes) ops.push({ ix: 3, op: 'delete', ep: 'attendanceEventCategoryDescriptors', key: 'uri://lakeside.org#TRU', etag: '"77a9…"' }, { ix: 4, op: 'delete', ep: 'descriptorMappings', key: 'TRU→ABS', etag: '"3b3b…"' });
  manifests.unshift({ id, year: p.year, publishedRevision: ys.revision, createdBy: me().id, created: '2026-10-06 now', status: 'approved', includeDeletes: p.deletes, targets: ok.map(t => t.id), ops });

screens.manifests = () => page({ title: 'Manifests', body: `<table class="sbaa"><thead><tr><th>#</th><th>Year set</th><th>Published rev</th><th>Ops</th><th>Targets</th><th>Deletes</th><th>Approved by</th><th>Status</th><th></th></tr></thead><tbody>

window.applyManifest = (id) => {
  const m = manifests.find(x => x.id === id); const t = targets.find(x => x.id === m.targets[0]);
  const rid = Math.max(...runs.map(r => r.id)) + 1;
  const records = m.ops.map(o => {
    if (o.op === 'delete' && o.ep === 'attendanceEventCategoryDescriptors') return { key: `${o.ep} · ${o.key}`, op: o.op, state: 'failed', err: '409 Conflict — cannot be deleted because it is a dependency of the \'StudentSchoolAttendanceEvent\' entity.' };
    if (o.op === 'delete') return { key: `${o.ep} · ${o.key}`, op: o.op, state: 'skipped', err: 'blocked: parent tombstone attendanceEventCategoryDescriptors#TRU failed' };
    if (o.key === 'uri://lakeside.org#REL') return { key: `${o.ep} · ${o.key}`, op: o.op, state: 'conflict', err: '412 Precondition Failed — ETag "5248…" no longer matches (SIS vendor wrote after manifest). Needs a new manifest.' };
    return { key: `${o.ep} · ${o.key}`, op: o.op, state: 'ok' };
  });
  const counts = { ok: 0, failed: 0, skipped: 0, conflict: 0, uncertain: 0 }; records.forEach(r => counts[r.state]++);
  const status = counts.failed || counts.skipped || counts.conflict || counts.uncertain ? 'partial' : 'success';
  runs.unshift({ id: rid, manifestId: m.id, year: m.year, when: '2026-10-06 now', by: me().id, targets: m.targets.map(i => fmtTarget(targets.find(x => x.id === i))), status, counts, records });
  m.status = 'done'; toast(`Run #${rid} ${status}: ${counts.ok} ok · ${counts.failed} failed · ${counts.skipped} skipped · ${counts.conflict} conflict`); go(`#/runs/${rid}`);
};

      <div class="field" style="grid-column:1/-1"><label class="view">Targets</label>${r.targets.join('<br/>')}</div>
    </div>
    <div class="grid3" style="margin-bottom:1rem"><div><div class="kpi" style="color:var(--green-800)">${r.counts.ok}</div><div class="muted">ok</div></div><div><div class="kpi" style="color:var(--red-800)">${r.counts.failed}</div><div class="muted">failed (refused by ODS/API)</div></div><div><div class="kpi" style="color:var(--yellow-800)">${r.counts.skipped}</div><div class="muted">skipped (blocked by a failure)</div></div></div>
    <div class="grid3" style="margin-bottom:2.5rem"><div><div class="kpi" style="color:var(--red-800)">${r.counts.conflict}</div><div class="muted">conflict (412 — needs new manifest)</div></div><div><div class="kpi" style="color:var(--purple-800)">${r.counts.uncertain}</div><div class="muted">uncertain (reconcile before retry)</div></div><div></div></div>
    ${r.status !== 'success' ? `<div class="alert error" style="margin-bottom:1.5rem">${I('bi-x-circle-fill')}<div><b>No rollback.</b> The ODS/API is non-transactional; what succeeded stays applied. Re-run finishes <i>this</i> manifest's failed, skipped, and uncertain operations only. Conflicts need a new manifest.</div></div>` : ''}
    ${section('Per-operation outcomes', r.records.length ? `<table class="sbaa"><thead><tr><th>Record</th><th>Op</th><th>State</th><th>Detail</th></tr></thead><tbody>${r.records.map(x => `<tr><td class="mono">${esc(x.key)}</td><td>${x.op}</td><td>${T(x.state)}</td><td class="${['failed','conflict'].includes(x.state)?'mono':'sm muted'}">${esc(x.err||'')}</td></tr>`).join('')}</tbody></table>` : '<span class="muted">All operations succeeded.</span>')}` });
};
window.rerun = id => { const r = runs.find(x => x.id === id); r.records.forEach(x => { if (x.state === 'uncertain') { x.state = 'ok'; x.err = 'reconciled: GET by natural key shows intended state — no retry needed'; } }); r.counts.uncertain = 0; r.counts.ok = r.records.filter(x => x.state === 'ok').length; toast('Re-run: uncertain reconciled by natural key; failed/skipped retried against the same manifest (409 persists until data changes)'); render(); };
screens.runs = () => page({ title: 'Runs', body: `${tableSearch()}<table class="sbaa"><thead><tr><th>#</th><th>Manifest</th><th>Year</th><th>Started</th><th>Publisher</th><th>Targets</th><th>ok / failed / skipped / conflict / uncertain</th><th>Status</th><th></th></tr></thead><tbody>
  ${runs.map(r => `<tr class="clickable" onclick="go('#/runs/${r.id}')"><td>${r.id}</td><td>#${r.manifestId}</td><td>${r.year}</td><td>${r.when}</td><td>${r.by}</td><td class="sm">${r.targets.join('<br/>')}</td><td class="mono">${r.counts.ok} / ${r.counts.failed} / ${r.counts.skipped} / ${r.counts.conflict} / ${r.counts.uncertain}</td><td>${T(r.status)}</td><td><button class="btn table-row row-hover">${I('bi-eye')}</button></td></tr>`).join('')}</tbody></table>` });

screens.drift = () => page({ title: `Drift &nbsp;${T('stretch','stretch')}`, actions: [{ icon: 'bi-arrow-repeat', text: 'Scan now', onclick: `toast('Read-only manifest build queued for every compatible target')`, disabled: !can('configure') }], body: `
  <div class="alert info" style="margin-bottom:1.5rem">${I('bi-info-circle-fill')}<div>Opt-in scheduled scan that reuses the manifest build in read-only mode — it never approves or applies. Owned-path drift → fix via a new manifest or adopt into a change request; external drift is visibility only.</div></div>
  <label class="chk" style="margin-bottom:1.5rem"><input type="checkbox" checked ${can('configure') ? '' : 'disabled'} onchange="toast('Scan schedule toggled (per partner, off-peak)')"/> Nightly scan enabled for ${partner.team}</label>
  ${drift.map(d => section(`${d.target} <span class="sm muted" style="font-weight:400">· scanned ${d.scanned} · ${d.owned} owned-path, ${d.external} external</span>`, d.rows.length ? `<table class="sbaa"><thead><tr><th>Record · path</th><th>MDM</th><th>ODS</th><th>Kind</th><th></th></tr></thead><tbody>${d.rows.map(r => `<tr class="${r.kind==='owned'?'diff-chg':'diff-ext'}"><td class="mono">${esc(r.key)} · ${esc(r.field)}</td><td>${esc(r.mdm)}</td><td>${esc(r.ods)}</td><td>${r.kind === 'owned' ? T('owned') : T('','external')}</td><td style="white-space:nowrap">${r.kind === 'owned' ? `<button class="btn table-row" onclick="go('#/push')">${I('bi-upload')} new manifest</button><button class="btn table-row" onclick="toast('Adopt → change request item with base revision')">${I('bi-box-arrow-in-down')} adopt</button>` : '<span class="sm muted">visibility only</span>'}</td></tr>`).join('')}</tbody></table>` : '<span class="muted">Only external drift; nothing MDM-owned differs.</span>')).join('')}` });

screens.sources = () => page({ title: 'Upstream sources', actions: [{ icon: 'bi-plus-lg', text: 'Create', onclick: `toast('HTTP API only: origin must be on the team allow-list; secret must be an MDM-owned Secrets Manager entry tagged with this team')`, disabled: !can('configure') }], body: `
  <div class="alert info" style="margin-bottom:1.5rem">${I('bi-info-circle-fill')}<div>Read-only HTTP-API connectors to a partner's system of record. Pulls land as change requests; connectors never write back. Destinations are allow-listed HTTPS origins; private/link-local addresses and cross-origin redirects are refused; secrets are team-bound. Direct database sources are deferred from v1.</div></div>
  <table class="sbaa"><thead><tr><th>Source</th><th>Origin (allow-listed)</th><th>Auth</th><th>Secret ref</th><th>Mapping</th><th>Last pull</th><th>Status</th><th></th></tr></thead><tbody>
  ${sources.map((s,i) => `<tr><td>${I('bi-plug')} &nbsp;${esc(s.name)}</td><td class="mono">${s.origin}</td><td>${s.auth}</td><td class="mono">${s.secret}</td><td class="sm">${esc(s.mapping)}</td><td>${s.last}</td><td>${T(s.status)}</td><td style="white-space:nowrap"><button class="btn table-row" ${can('edit') ? '' : 'disabled'} onclick="pullSource(${i})">${I('bi-download')} Pull now</button><button class="btn table-row" ${can('configure') ? '' : 'disabled'} onclick="toast('Edit mapping: endpoint + JSON paths → Ed-Fi write shape, incl. nested objects/arrays')">${I('bi-pencil')}</button></td></tr>`).join('')}</tbody></table>` });
window.pullSource = i => { const d = ensureDraft(); d.title = `Pull from ${sources[i].name}`; d.contributors = [...new Set([...d.contributors, 'svc-pipeline'])]; d.items.push({ op: 'update', ep: 'schools', key: 'School#255901104', base: 7, before: { shortNameOfInstitution: 'WLM' }, after: { shortNameOfInstitution: 'WLMS' } }); toast(`Pull complete (bounded response, 2 rows) → draft #${d.id}`); go(`#/cr/${d.id}`); };

screens.settings = () => page({ title: 'Settings · managed scopes', actions: [{ icon: 'bi-plus-lg', text: 'Add scope', onclick: `toast('Scope kinds: descriptor namespace prefix · EdOrg subtree · exact EdOrg (edorg) · all')`, disabled: !can('configure') }], body: `
  ${!can('configure') ? noPriv('configure') : ''}
  ${section('Partner namespaces (set on the MDM vendor in SBAA)', `<div class="row wrap">${['uri://ea.startingblocks.org','uri://lakeside.org'].map(n => `<span class="tag">${n}</span>`).join('')}<button class="btn sm outline" ${can('configure')?'':'disabled'} onclick="toast('PUT /api/teams/:teamId/mdm/namespaces → vendor namespacePrefixes updated')">${I('bi-pencil')} Edit</button></div><div class="sm muted" style="margin-top:.5rem">Descriptors in <span class="mono">uri://ed-fi.org</span> and other vendors' namespaces are imported read-only. Ed-Fi namespace authorization is separate from resource CRUD.</div>`)}
  ${section('Managed scopes by year set', `<table class="sbaa"><thead><tr><th>Year set</th><th>Kind</th><th>Scope</th><th></th></tr></thead><tbody>${Object.entries(scopes).sort((a,b)=>b[0]-a[0]).flatMap(([y, list]) => list.map(sc => `<tr><td>${y}</td><td>${T('', sc.kind)}</td><td class="mono">${sc.res ? sc.res + ' · ' : ''}${sc.value}</td><td><button class="btn table-row row-hover" ${can('configure')?'':'disabled'}>${I('bi-trash')}</button></td></tr>`)).join('')}</tbody></table><div class="sm muted" style="margin-top:.5rem">MDM may create, update, or tombstone records only inside a scope. Set difference between a target and MDM never produces a delete.</div>`)}
  ${section('Field ownership policy (v1 global defaults)', `<table class="sbaa"><thead><tr><th>Family</th><th>Owned paths</th><th>Create</th><th>Update</th></tr></thead><tbody>${families.map(f => `<tr><td>${f.label}</td><td>${f.owned === 'all' ? 'all' : '<span class="mono">nameOfInstitution, shortNameOfInstitution, parent refs, categories</span>'}</td><td>full stored payload</td><td>${f.owned === 'all' ? 'full replace' : 'owned paths merged into target representation'}</td></tr>`).join('')}</tbody></table>`)}` });

screens.rollforward = () => page({ title: 'Roll forward', body: `
  ${!can('edit') ? noPriv('edit') : ''}
  <div class="row wrap" style="margin-bottom:1.5rem"><div class="field" style="margin:0"><label style="margin-top:0">From year set</label><select class="input"><option>2026 · DS 5.2 (rev 517)</option><option>2025 · DS 5.1 (rev 402)</option><option>2024 · DS 4.0 — EA 6.x sandbox (rev 118)</option></select></div><span style="margin-top:1.75rem">${I('bi-arrow-right')}</span><div class="field" style="margin:0"><label style="margin-top:0">New year set</label><input class="input" value="2027" style="width:6em"/></div><div class="field" style="margin:0"><label style="margin-top:0">Pin data standard</label><select class="input"><option>DS 5.2 (same — straight copy)</option><option>DS 6.0 (mapping required)</option></select></div></div>
  <div class="sm muted" style="margin-bottom:1rem">Creates the new year set first, then clones published records into one draft change request. Each family's registry rule decides what changes: school-year fields rewritten, year-less resources cloned unchanged, fiscal-year keys handled per overlay. Crossing a standard applies the hand-written mapping; unmapped required fields become item errors.</div>
  <table class="sbaa"><thead><tr><th>Family</th><th>Records</th><th>Roll-forward rule</th><th>Mapping</th></tr></thead><tbody>${families.map((f,i) => `<tr><td>${I(f.icon)} &nbsp;${f.label}</td><td>${counts[2026][i]}</td><td class="sm">${f.key === 'chartOfAccounts' ? 'fiscal-year key rewritten per overlay' : ['descriptors','programs','courses'].includes(f.key) ? 'year-less — cloned unchanged' : 'school-year fields rewritten'}</td><td>${T('ok','same standard — none')}</td></tr>`).join('')}</tbody></table>
  <div style="margin-top:1.5rem"><button class="btn primary" ${can('edit')?'':'disabled'} onclick="toast('Year set 2027 created (DS 5.2 pinned). Roll-forward job queued → draft change request.')">${I('bi-arrow-repeat')} Create 2027 from 2026</button></div>` });

screens.account = () => page({ title: 'Account', body: `<div class="attrs"><div class="field"><label class="view">Name</label>${me().name}</div><div class="field"><label class="view">Team</label>${partner.team}</div><div class="field"><label class="view">SBAA role</label>${T('', me().role)}</div><div class="field"><label class="view">Effective MDM privileges</label>${me().priv.map(p => `<span class="mono">team.mdm:${p}</span>`).join(' ')}</div><div class="field"><label class="view">Identity resolved by</label><span class="mono">POST /api/mdm/identity</span> (SBAA, service-to-service)</div></div>
  ${section('Roles (one per membership)', `<table class="sbaa"><thead><tr><th>Role</th><th>Privileges</th><th>Note</th></tr></thead><tbody>${[['mdm-editor','read, edit',''],['mdm-approver','read, edit, approve','cannot approve a batch they contributed to'],['mdm-publisher','read, edit, publish','approves and applies manifests'],['mdm-admin','read, edit, approve, publish, configure','not exempt from separation of duties'],['machine user','read, edit, publish','can never approve']].map(r => `<tr><td class="mono">${r[0]}</td><td>${r[1]}</td><td class="sm muted">${r[2]}</td></tr>`).join('')}</tbody></table>`)}` });

/* ======================= routing ======================= */
function route() {
  const h = (location.hash || '#/').slice(2).split('/');
  if (h[0] === 'year') return h[2] ? screens.records(h[1], h[2]) : screens.year(h[1]);
  if (h[0] === 'cr') return h[1] ? screens.cr(h[1]) : screens.crList();
  if (h[0] === 'push') return screens.push();
  if (h[0] === 'manifests') return h[1] ? screens.manifest(h[1]) : screens.manifests();
  if (h[0] === 'runs') return h[1] ? screens.run(h[1]) : screens.runs();
  if (h[0] === 'drift') return screens.drift();
  if (h[0] === 'sources') return screens.sources();
  if (h[0] === 'settings') return screens.settings();
  if (h[0] === 'rollforward') return screens.rollforward();
  if (h[0] === 'account') return screens.account();
  return screens.home();
}
function crumbs() {
  const h = (location.hash || '#/').slice(2).split('/'); const c = [['#/', 'Home']];
  const yr = y => c.push([`#/year/${y}`, `School year ${y}`]);
  if (h[0] === 'year') { yr(h[1]); if (h[2]) c.push([location.hash, families.find(f => f.key === h[2])?.label || h[2]]); }
  if (h[0] === 'cr') { c.push(['#/cr', 'Change requests']); if (h[1]) c.push([location.hash, `#${h[1]}`]); }
  if (h[0] === 'push') { yr(S.push.year); c.push([location.hash, 'Build manifest']); }
  if (h[0] === 'manifests') { c.push(['#/manifests', 'Manifests']); if (h[1]) c.push([location.hash, `#${h[1]}`]); }
  if (h[0] === 'runs') { c.push(['#/runs', 'Runs']); if (h[1]) c.push([location.hash, `#${h[1]}`]); }
  if (h[0] === 'drift') c.push([location.hash, 'Drift']);
  if (h[0] === 'sources') c.push([location.hash, 'Upstream sources']);
  if (h[0] === 'settings') c.push([location.hash, 'Settings']);
  if (h[0] === 'rollforward') { yr(2026); c.push([location.hash, 'Roll forward']); }
  if (h[0] === 'account') c.push([location.hash, 'Account']);
  return `<div class="crumbs">${c.map(([href, label], i) => `${i ? '<span class="sep">/</span>' : ''}<a href="${href}">${label}</a>`).join('')}</div>`;
}
const isOn = h => (location.hash || '#/') === h || ((location.hash || '#/').startsWith(h + '/') && h !== '#/');

/* ======================= shell (SBAA chrome) ======================= */
const navBtn = (href, icon, text, { depth = 0, on = isOn(href) } = {}) => `<a class="navbtn ${on ? 'on' : ''}" style="--d:${depth}em" href="${href}" title="${esc(text)}">${I(icon + (on ? '-fill' : ''))}<span>${esc(text)}</span></a>`;
const navTree = (y, depth = 0) => {
  const open = !!S.open[y.year];
  return `<div class="navrow"><div class="caretwrap"><button class="caret ${open ? 'opened' : ''}" style="--d:${depth}em" onclick="S.open[${y.year}]=!S.open[${y.year}];render()" aria-label="open or close">${I('bi-caret-right-fill')}</button></div>${navBtn(`#/year/${y.year}`, 'bi-calendar3', `${y.year} · ${y.ds}`, { depth, on: (location.hash || '') === `#/year/${y.year}` })}</div>
    ${open ? famsFor(y.year).map(f => navBtn(`#/year/${y.year}/${f.key}`, f.icon, f.label, { depth: depth + 1 })).join('') : ''}`;
};
const shell = (content) => `<div class="layout">
      <header class="appbar"><div class="left"><a href="#/"><img alt="logo" src="logo-sb.svg"/></a><span class="team">${partner.team}</span></div>
        <div class="right"><span class="sm muted">Acting as</span><select class="userpick" onchange="S.userIx=+this.value;render()">${users.map((u,i) => `<option value="${i}" ${i===S.userIx?'selected':''}>${u.id} · ${u.role}</option>`).join('')}</select><a class="iconbtn" title="Help guide" href="https://docs.startingblocks.org/" target="_blank" rel="noopener noreferrer">${I('bi-question-lg')}</a><a class="iconbtn" style="width:auto;gap:0;padding:0" title="Account" href="#/account"><span class="avatar">${me().name.split(' ').map(s=>s[0]).join('').slice(0,2).toUpperCase()}</span>${I('bi-caret-down', 'muted')}</a></div></header>
      <main class="std">
        <nav class="sbnav"><div class="resize"></div>
          <div class="teamsel"><div class="input" title="Select a team (or global) context"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${partner.team}</span>${I('bi-chevron-down','muted')}</div></div>
          ${navBtn('#/', 'bi-house-door', 'Home')}
          ${navBtn('#/account', 'bi-person', 'Account')}
          ${navBtn('#/cr', 'bi-file-earmark-diff', 'Change requests')}
          ${navBtn('#/manifests', 'bi-file-lock2', 'Manifests')}
          ${navBtn('#/runs', 'bi-upload', 'Runs')}
          ${navBtn('#/drift', 'bi-activity', 'Drift')}
          ${navBtn('#/sources', 'bi-plug', 'Upstream sources')}
          ${navBtn('#/settings', 'bi-sliders', 'Settings')}
          <h3>Year sets</h3>
          <div class="envsearch"><div class="search-wrap">${I('bi-search')}<input class="input sm pill" placeholder="Search" style="padding-left:2.5rem"/></div></div>
          <div class="scroll">${yearSets.slice().reverse().map(y => navTree(y)).join('')}</div>
        </nav>
        <div class="content"><div class="inner">${crumbs()}<div class="body">${content}</div><div class="copy">©2023-${new Date().getFullYear()} Education Analytics, Inc. All Rights Reserved</div></div></div>
      </main></div>`;

function render() { document.getElementById('app').innerHTML = shell(route()); }
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
